name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  pull_request:
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC

jobs:
  lint:
    name: Lint
    uses: canonical/data-platform-workflows/.github/workflows/lint.yaml@v42.0.1

  unit-test:
    name: Unit Test library
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: Run tests
        run: tox run -e unit
        env:
          LIBJUJU_VERSION_SPECIFIER: "==3.6.1.3"

  integration-test-v1:
    strategy:
      fail-fast: false
      matrix:
        ubuntu-versions:
          # Update whenever charmcraft.yaml is changed
          - series: noble
            bases-index: 0
        tests:
          - tox-environment: integration-db-v1
            provider: microk8s
          - tox-environment: integration-opensearch-v1
            provider: microk8s
          - tox-environment: integration-kafka-v1
            provider: microk8s
          - tox-environment: integration-kafka-connect-v1
            provider: microk8s
          - tox-environment: integration-backward-compatibility-v1
            provider: microk8s
          - tox-environment: integration-status-v1
            provider: microk8s
          - tox-environment: integration-etcd-v1
            provider: lxd
        juju-version:
          - juju-bootstrap-option: "3.6.1"
            juju-snap-channel: "3.6/stable"
            libjuju-version: "3.6.1.3"
    name: V1 -- ${{ matrix.tests.tox-environment }} Juju ${{ matrix.juju-version.juju-snap-channel}} -- ${{ matrix.ubuntu-versions.series }}
    needs:
      - lint
      - unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup k8s controller
        if: ${{ 'microk8s' == matrix.tests.provider }}
        # TODO: Replace with custom image on self-hosted runner
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: microk8s
          channel: "1.35-strict/stable"
          bootstrap-options: "--agent-version ${{ matrix.juju-version.juju-bootstrap-option }}"
          juju-channel: ${{ matrix.juju-version.juju-snap-channel }}
          charmcraft-channel: "3.x/stable"
      - name: Setup lxd controller
        if: ${{ 'lxd' == matrix.tests.provider }}
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: lxd
          juju-channel: ${{ matrix.juju-version.juju-snap-channel }}
          charmcraft-channel: "3.x/stable"
      - name: Select tests
        id: select-tests
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]
          then
            echo Running unstable and stable tests
            echo "mark_expression=" >> "$GITHUB_OUTPUT"
          else
            echo Skipping unstable tests
            echo "mark_expression=not unstable" >> "$GITHUB_OUTPUT"
          fi
      - name: Run integration tests
        # set a predictable model name so it can be consumed by charm-logdump-action
        run: tox run -e ${{ matrix.tests.tox-environment }} -- -m '${{ steps.select-tests.outputs.mark_expression }}' --model testing  --os-series=${{ matrix.ubuntu-versions.series }} --build-bases-index=${{ matrix.ubuntu-versions.bases-index }}
        env:
          LIBJUJU_VERSION_SPECIFIER: "==${{ matrix.juju-version.libjuju-version }}"
      - name: Print debug-log
        if: failure()
        run: juju switch testing; juju debug-log --replay --no-tail
      - name: Dump logs
        uses: canonical/charm-logdump-action@main
        if: failure()
        with:
          app: data-platform-libs
          model: testing
